# Check-in tests: build the page and run every Audit Pup test on each pull request and each push to main.
# The "tests" check is required for main by the repository ruleset, so nothing untested can merge.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:          # the weekly workflow runs this same suite

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install the locked tools (pdf.js, Playwright)
        working-directory: source
        run: npm ci

      - name: Install the browser for the locked Playwright version
        working-directory: source
        run: npx playwright install --with-deps chromium

      - name: Build the page
        working-directory: source
        run: node build_html.js

      - name: Run every test
        env:
          NODE_PATH: ${{ github.workspace }}/source/node_modules   # the test scripts load Playwright from here
        run: bash tests/run_all.sh

      - name: Keep the test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/output/
          retention-days: 14
