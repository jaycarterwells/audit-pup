# Every week: run the full suite on main and check the live site, to catch changes in Chrome, the tools, or the site
# before a counselor does. Also runs by hand (Actions, weekly, Run workflow). GitHub pauses scheduled runs after
# 60 days with no activity in the repository; any push or a manual run starts them again.
name: weekly

on:
  schedule:
    - cron: '23 10 * * 0'      # Sundays 10:23 UTC (2:23 or 3:23 a.m. in California)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the newest live check from main, expecting the latest release's version; it skips cases not released yet
      - name: Find the latest release
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "latest release: $tag"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install the locked tools and the browser
        working-directory: source
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the live site
        env:
          NODE_PATH: ${{ github.workspace }}/source/node_modules
        run: node tests/live_check.js https://jaycarterwells.github.io/audit-pup/ "$VERSION"
